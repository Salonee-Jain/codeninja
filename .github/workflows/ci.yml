name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ninja
          POSTGRES_PASSWORD: ninja
          POSTGRES_DB: codeninja
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ninja -d codeninja"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://ninja:ninja@localhost:5432/codeninja?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Every lesson, quiz, problem and flashcard is schema-checked, and every
      # reference solution is executed against its own tests.
      - name: Validate course content
        run: npm run content:validate

      - run: npm run build -w @codeninja/content
      - run: npm run typecheck

      - name: Migrate & seed
        run: |
          npm run generate -w @codeninja/api
          npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
          npm run seed -w @codeninja/api

      - run: npm run build -w @codeninja/api
      - run: npm run build -w @codeninja/web

      - name: API end-to-end smoke test
        run: |
          node apps/api/dist/index.js &
          npx wait-on http://localhost:4000/health -t 30000
          node scripts/smoke.mjs

      - name: Browser smoke test
        run: |
          npx playwright install --with-deps chromium
          npm run start -w @codeninja/web &
          npx wait-on http://localhost:3000 -t 60000
          node scripts/ui-smoke.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: /tmp/shots
          if-no-files-found: ignore
