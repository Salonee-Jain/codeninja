services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ninja
      POSTGRES_PASSWORD: ninja
      POSTGRES_DB: codeninja
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ninja -d codeninja']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '60', '1', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    ports: ['6379:6379']

  # Optional: sandboxed executor for Python / Go / Java / PHP problems.
  # Enable with `docker compose --profile executor up -d`
  piston:
    image: ghcr.io/engineer-man/piston
    profiles: ['executor']
    restart: unless-stopped
    privileged: true
    ports: ['2000:2000']
    volumes: ['piston:/piston']

volumes:
  pgdata:
  piston:
